<mat-sidenav-container class="shell-container">
  <mat-sidenav
    #navigationDrawer
    class="shell-drawer"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [attr.aria-label]="'PORTAL.NAV.MAIN_LABEL' | translate"
  >
    <a class="brand" routerLink="/courses">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.8 14.7 9l7.5 3-7.5 2.9-2.7 7.3-2.8-7.3L1.8 12l7.4-3L12 1.8Z" />
      </svg>
      <span>{{ 'PORTAL.BRAND' | translate }}</span>
    </a>
    <nav class="navigation">
      <a
        mat-button
        class="navigation-link"
        routerLink="/courses"
        routerLinkActive="navigation-link-active"
        (click)="isHandset() && navigationDrawer.close()"
      >
        <svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4.5 4.5h6.2c1.2 0 2.3.5 3.1 1.3.8-.8 1.9-1.3 3.1-1.3h2.6v14h-2.6c-1.2 0-2.3.4-3.1 1.2-.8-.8-1.9-1.2-3.1-1.2H4.5v-14Z"
          />
          <path d="M13.8 6v13.1M7 8h3.1M7 11h3.1" />
        </svg>
        <span>{{ 'PORTAL.NAV.COURSES' | translate }}</span>
      </a>
    </nav>
    <div class="drawer-footer">
      <span class="offline-dot"></span>{{ 'PORTAL.PLAYER.OFFLINE_READY' | translate }}
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar class="shell-toolbar">
      <button
        mat-icon-button
        type="button"
        class="menu-button icon-button"
        [attr.aria-label]="'PORTAL.TOOLBAR.OPEN_MENU' | translate"
        (click)="navigationDrawer.toggle()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" /></svg>
      </button>
      <span class="toolbar-spacer"></span>
      <div class="toolbar-actions">
        <button
          mat-button
          type="button"
          class="language-button"
          [matMenuTriggerFor]="languageMenu"
          [attr.aria-label]="'PORTAL.TOOLBAR.LANGUAGE_MENU' | translate"
        >
          <span class="language-label">
            <svg class="language-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" />
              <path
                d="M3.8 12h16.4M12 3.5c2.2 2.3 3.2 5.1 3.2 8.5s-1 6.2-3.2 8.5C9.8 18.2 8.8 15.4 8.8 12s1-6.2 3.2-8.5Z"
              />
            </svg>
            <span>{{ currentLanguageKey() | translate }}</span>
            <svg class="dropdown-chevron" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 9.5 5 5 5-5" />
            </svg>
          </span>
        </button>
        <mat-menu #languageMenu="matMenu">
          <button mat-menu-item type="button" (click)="setLanguage('ar')">
            {{ 'PORTAL.LANGUAGE.ARABIC' | translate }}
          </button>
          <button mat-menu-item type="button" (click)="setLanguage('en')">
            {{ 'PORTAL.LANGUAGE.ENGLISH' | translate }}
          </button>
        </mat-menu>
        <button
          mat-icon-button
          type="button"
          class="theme-button icon-button"
          [attr.aria-label]="
            (darkMode() ? 'PORTAL.TOOLBAR.LIGHT_MODE' : 'PORTAL.TOOLBAR.DARK_MODE') | translate
          "
          (click)="toggleTheme()"
        >
          @if (darkMode()) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.8" />
              <path
                d="M12 2.5v2.1M12 19.4v2.1M4.9 4.9l1.5 1.5m11.2 11.2 1.5 1.5M2.5 12h2.1m14.8 0h2.1M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5"
              />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.2 15.2A8.7 8.7 0 0 1 8.8 3.8 8.8 8.8 0 1 0 20.2 15.2Z" />
            </svg>
          }
        </button>
      </div>
    </mat-toolbar>

    <main class="page-content">
      <router-outlet />
    </main>
    <footer class="app-footer" dir="auto">
      {{ 'PORTAL.FOOTER.COPYRIGHT' | translate: { year: currentYear } }}
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
